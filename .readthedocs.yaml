# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the version of Python and other tools you might need
build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  jobs:
    post_install:
      # Install pyavs itself (no deps) so autodoc can introspect real
      # docstrings/signatures. Heavy runtime deps (mne, sklearn, cv2,
      # pycocotools) are intentionally NOT installed here -- they're mocked
      # in docs/conf.py via autodoc_mock_imports.
      - pip install --no-deps -e .

# Build documentation in the docs/ directory with Sphinx
sphinx:
   configuration: docs/conf.py
   fail_on_warning: true

# If using Sphinx, optionally build your docs in additional formats such as PDF
# formats:
#    - pdf

# Optionally declare the Python requirements required to build your docs
python:
   install:
   - requirements: docs/requirements.txt
