[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "pyavs"
dynamic = ["version"]
description = "Python package for Active Visual Semantics dataset processing"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "P. Sulewski", email = "psulewski@uni-osnabrueck.de"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = [
    "neuroscience",
    "MEG",
    "eye-tracking", 
    "visual-semantics",
    "BIDS",
    "neuroimaging",
    "cognitive-science",
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.19.0",
    "pandas>=1.3.0",
    "pyarrow>=10.0.0",
    "scipy>=1.7.0",
    "matplotlib>=3.3.0",
    "seaborn>=0.11.0",
    "h5py>=3.1.0",
    "pillow>=8.0.0",
    "scikit-image>=0.18.0",
    "scikit-learn>=1.0.0",
    "pycocotools>=2.0.0",
    "mne>=1.0.0",
    "tqdm>=4.60.0",
    "joblib>=1.0.0",
    "requests>=2.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "black>=21.0",
    "flake8>=3.8",
    "isort>=5.0",
    "pre-commit>=2.0",
]
docs = [
    "sphinx>=7.0",
    "furo>=2024.8.6",
    "sphinx-design>=0.6.0",
    "sphinx-copybutton>=0.5.2",
    "myst-parser>=2.0.0",
]
full = [
    "jupyter>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/KietzmannLab/pyavs"
Documentation = "https://pyavs.readthedocs.io/"
Repository = "https://github.com/KietzmannLab/pyavs.git"
"Bug Reports" = "https://github.com/KietzmannLab/pyavs/issues"
Changelog = "https://github.com/KietzmannLab/pyavs/blob/main/CHANGELOG.md"

[project.scripts]
pyavs = "pyavs.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["pyavs*"]

[tool.setuptools.package-data]
pyavs = ["examples/*.py", "data/*.csv", "data/*.json"]

[tool.setuptools_scm]
write_to = "pyavs/_version.py"

[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310", "py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["pyavs"]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "docs/conf.py",
    "build",
    "dist",
    ".eggs",
    "*.egg-info",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["pyavs"]
omit = [
    "*/tests/*",
    "*/test_*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]